<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1a2b">
<title>건우 대전쟁</title>
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-ui.css">
<link rel="stylesheet" href="css/03-battlecats-theme.css">
<link rel="stylesheet" href="css/04-features.css">
</head>
<body>
<div id="game">
<section id="start" class="scr">
  <div class="t1">건우</div><div class="t2">대전쟁</div>
  <p class="sub">준치와 함께 48개 나라를 정복하라</p>
  <canvas id="sc" width="800" height="120"></canvas>
  <button id="goStart">게임 시작</button>
</section>

<section id="login" class="scr hide">
  <div class="top"><button id="lgBack">뒤로</button><b>로그인</b><span></span></div>
  <div class="box">
    <div class="tr"><b>닉네임으로 시작</b> <small>(이 기기에만 저장돼요)</small><div style="display:flex;gap:8px;margin-top:8px"><input id="nick" maxlength="12" placeholder="닉네임 (최대 12자)"><button id="lgLocal" style="white-space:nowrap">시작</button></div></div>
    <div class="tr"><b>클라우드 로그인</b> <small>(어느 기기에서든 이어하기)</small><div class="nav" style="margin-top:8px"><button id="lgG">Google 로그인</button><button id="lgGH">GitHub 로그인</button></div><small id="cloudMsg"></small></div>
    <button id="lgGuest">게스트로 시작</button>
  </div>
</section>

<section id="world" class="scr hide">
  <div class="top"><button id="wdBack">처음으로</button><b>월드 선택</b><span id="wdUser" style="font-size:.85rem"></span></div>
  <div class="wgrid" id="wgrid"></div>
</section>

<section id="select" class="scr hide">
  <div class="top"><button id="backStart">월드 선택</button><b>스테이지 선택</b><span id="cur" style="font-size:.85rem"></span></div>
  <div class="nav"><button id="goUp">캐릭터</button><button id="goForm">편성</button><button id="goGa">뽑기</button><button id="goQ">퀘스트</button><button id="goDex">적도감</button><button id="goMyDex">아군도감</button><button id="goDaily">출석</button><button id="goTr">보물</button><button id="goOut">계정</button></div>
  <div class="chtab" id="chtab"></div>
  <div id="grid"></div>
</section>

<section id="form" class="scr hide"><div class="top"><button class="bk">뒤로</button><b>캐릭터 편성</b><b id="fc"></b></div><div id="formationBar"></div><div class="chtab" id="formTabs"></div><div id="forml"></div></section>
<section id="gacha" class="scr hide"><div class="top"><button class="bk">뒤로</button><b>건우 뽑기</b><b id="gc"></b></div><div id="gl"><div id="bannerTabs"></div><canvas id="gcv" width="800" height="360"></canvas><div id="gp"></div></div></section>
<section id="quest" class="scr hide"><div class="top"><button class="bk">뒤로</button><b>퀘스트</b><span></span></div><div id="ql"></div></section>
<section id="up" class="scr hide">
  <div class="top"><button id="backSel2">뒤로</button><b>캐릭터 강화 / 스펙</b><b id="xpv"></b></div>
  <div id="upl"></div>
</section>

<section id="tre" class="scr hide">
  <div class="top"><button id="backSel">뒤로</button><b>보물</b><span></span></div>
  <div id="trl"></div>
</section>

<section id="enemyDex" class="scr hide"><div class="top"><button id="dexBack">뒤로</button><b>적도감</b><small id="dexTotal"></small></div><p><small>전투에서 한 번이라도 만난 적은 도감에 등록돼요. 적을 누르면 능력치를 확인할 수 있어요.</small></p><div id="dexList"></div></section>
<section id="myDex" class="scr hide"><div class="top"><button id="myDexBack">뒤로</button><b>아군 캐릭터 도감</b><small id="myDexCount"></small></div><div class="chtab" id="myDexTabs"></div><div id="myDexList" style="overflow:auto;flex:1"></div></section>
<section id="attendance" class="scr hide"><div class="top"><button id="dailyBack">뒤로</button><b>일일 출석 보상</b><span id="dailyDate"></span></div><div id="dailyList"></div></section>
<section id="battle" class="scr hide">
  <div id="bwrap"><canvas id="c" width="800" height="300"></canvas>
    <div id="hud"><button id="pause">Ⅱ</button><b id="stageTitle"></b><div id="battleMoneyTools"><span id="money"></span><button id="speedToggle" type="button" aria-pressed="false">스피드업 OFF · 1배속</button></div></div>
    <div id="pmenu" class="hide"><div class="pbox"><h2>일시정지</h2><button id="resume">게임 계속하기</button><button id="exit">게임 나가기</button></div></div>
    <div id="unitInfoLayer" class="hide" role="dialog" aria-modal="true" aria-label="캐릭터 정보">
      <div id="unitInfoCard"><div id="unitInfoHead"><div id="unitInfoPortrait"></div><div id="unitInfoName"></div><button id="unitInfoClose" type="button">닫기 ✕</button></div><div id="unitInfoBody"></div><div id="unitInfoHint">캐릭터 정보를 확인한 뒤 닫기를 눌러 전투를 계속하세요.</div></div>
    </div>
  </div>
  <div id="ctrl"><button id="wk"></button><div id="slots"></div><button id="cn"></button></div>
</section>
<button id="fsb" title="전체화면">⛶</button><button id="snd" title="소리">🔊</button>
<div id="toast" class="hide"></div>
</div>
<div id="rot">📱 기기를 가로로 돌려주세요 (가로 화면 전용 게임이에요)</div>
<script src="js/01-core.js"></script>
<script src="js/02-sprites.js"></script>
<script src="js/03-traits.js"></script>
<script src="js/04-units.js"></script>
<script src="js/05-treasures.js"></script>
<script src="js/06-enemies-stages.js"></script>
<script src="js/07-save-login.js"></script>
<script src="js/08-world-navigation.js"></script>
<script src="js/09-stage-selection-formation.js"></script>
<script src="js/10-gacha.js"></script>
<script src="js/11-quests.js"></script>
<script src="js/12-upgrades.js"></script>
<script src="js/13-battle-controls.js"></script>
<script src="js/14-battle-logic.js"></script>
<script src="js/15-battle-graphics.js"></script>
</body>
</html>
