<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1a2b">
<title>건우 대전쟁</title>
<style>
:root{--bg:#000;--fg:#eef4ff;--card:#182a45;--card2:#223a5e;--line:#3d5f93;--btn:#ffc83d;--btnfg:#3a2100;--btn2:#ff9d1c;--clear:#5cd68a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;overscroll-behavior:none;touch-action:manipulation}
/* 냥코처럼 가로 16:9 고정 화면 (960x540) — 창 크기에 맞춰 통째로 확대/축소 */
#game{position:fixed;left:50%;top:50%;width:960px;height:540px;overflow:hidden;transform-origin:center;background:#0a1220}
.hide{display:none!important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:10px 14px;animation:scin .25s ease-out;background:radial-gradient(ellipse at 50% 0%,#1d3a66,#0a1220 75%)}
.scr p{margin:0;opacity:.85}
@keyframes scin{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
button{font:inherit;font-weight:800;color:var(--btnfg);background:linear-gradient(#ffe27a,var(--btn) 55%,var(--btn2));border:2px solid #7a4a00;border-bottom-width:4px;border-radius:10px;padding:8px 14px;cursor:pointer;touch-action:manipulation;text-shadow:0 1px 0 #fff6}
button:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
button:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
input{font:inherit;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:#0a1220;color:#fff;width:100%;-webkit-user-select:text;user-select:text}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-right:92px;min-height:40px;font-size:1.05rem}
.top button{padding:6px 12px}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.nav button{flex:1 1 70px;padding:10px 6px;font-size:.95rem}
#grid,#forml,#ql,#upl,#trl{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;align-content:start;padding:2px}
#grid button{background:linear-gradient(var(--card2),var(--card));color:var(--fg);border:2px solid var(--line);border-bottom-width:4px;padding:8px 2px;font-size:.8rem;line-height:1.25;text-shadow:none}
#grid button.cl{border-color:var(--clear)}
#grid b{display:block;font-size:1.1rem}
.country-mark{display:block;width:30px;height:30px;margin:2px auto 0;fill:#8a6a37;stroke:#5b3c1c;stroke-width:1.2;filter:drop-shadow(1px 1px 0 #fff6)}
#grid button.cl .country-mark{fill:#477b36;stroke:#244b20}
.treasure-jump{cursor:pointer;font:inherit}
.tr{background:linear-gradient(var(--card2),var(--card));border:2px solid var(--line);border-radius:12px;padding:10px;margin:0 0 8px;text-align:left;font-size:.92rem}
.tr small{opacity:.8}
.up{display:flex;gap:10px;align-items:flex-start}.up>div{flex:1}
.ic{width:auto;max-width:none;border:0;background:none;image-rendering:pixelated}
/* 시작 화면 */
#start{align-items:center;justify-content:center;text-align:center;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 25%,#2f5b86,#0d1620 72%);animation:shake .4s 1.5s}
#start::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff0a 0 14px,transparent 14px 40px);animation:slide 6s linear infinite;pointer-events:none}
#start>*{position:relative;z-index:1}
.t1{font-size:84px;font-weight:900;letter-spacing:.12em;line-height:1;text-shadow:0 5px 0 #0b1118,0 0 28px #7fd0ff;animation:drop 1.1s cubic-bezier(.3,.9,.4,1) both}
.t2{font-size:58px;font-weight:900;line-height:1.1;color:#ffd84a;text-shadow:0 4px 0 #8a3b00,0 0 24px #ff9a3c;animation:fly .6s .9s cubic-bezier(.2,.9,.3,1.1) both}
.sub{opacity:0;margin:10px 0 0;animation:fade .8s 2s forwards}
#start #sc{width:720px;height:auto;image-rendering:pixelated;margin-top:14px;opacity:0;animation:fade .8s 2.2s forwards}
#start #goStart{font-size:1.4rem;padding:14px 44px;margin-top:14px;opacity:0;animation:fade .6s 2.4s forwards,pulse 1.4s 3s infinite}
@keyframes drop{0%{transform:translateY(-700px) rotate(-25deg)}55%{transform:translateY(0) rotate(5deg)}70%{transform:translateY(-34px)}85%{transform:translateY(0)}100%{transform:none}}
@keyframes fly{0%{transform:translateX(1200px) skewX(-35deg)}70%{transform:translateX(-14px) skewX(8deg)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-6px,4px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-3px,2px)}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes slide{to{background-position:200px 0}}
/* 로그인 */
#login{align-items:center}
#login .box{width:640px;display:flex;flex-direction:column;gap:10px}
/* 전투 화면: 위 = 전장(960x360), 아래 = 냥코 스타일 조작 패널(일꾼 / 유닛 5x2 / 대포) */
#battle{padding:0;gap:0;background:#000}
#bwrap{position:relative;height:360px;flex:none;background:#000}
#c{position:absolute;left:0;top:0;width:960px;height:360px;image-rendering:pixelated}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 100px 0 10px;pointer-events:none}
#hud>*{pointer-events:auto}
#pause{padding:4px 14px;font-size:1.1rem}
#stageTitle{position:absolute;left:0;right:0;top:10px;text-align:center;text-shadow:0 2px 0 #000;font-size:.9rem;pointer-events:none}
#money{font-size:1.9rem;font-weight:900;color:#ffd84a;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;pointer-events:none}
#pmenu{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}
.pbox{display:flex;flex-direction:column;gap:12px;width:300px;background:linear-gradient(var(--card2),var(--card));border:3px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.pbox h2{margin:0 0 4px}
.pbox button{padding:14px;font-size:1.1rem}
#ctrl{flex:1;display:grid;grid-template-columns:150px 1fr 150px;gap:8px;padding:8px 10px;background:linear-gradient(#1a2c4a,#0a1220);border-top:3px solid var(--line)}
#wk,#cn{height:100%;font-size:1.05rem;line-height:1.35;white-space:normal;padding:4px}
#wk small,#cn small{font-weight:600;opacity:.8}
#slots{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:6px;min-height:0}
#slots button{position:relative;overflow:hidden;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(#3a5f96,#1c2f55);color:#fff;border:2px solid #9cc0ff;border-bottom-width:4px;text-shadow:none;min-height:0}
#slots button:disabled{filter:none;opacity:.35}
#slots canvas{max-height:50px;max-width:80%;width:auto;height:auto;image-rendering:pixelated}
#slots .pr{font-weight:900;font-size:.95rem;color:#ffd84a;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
#slots .cdv{position:absolute;left:0;right:0;top:0;height:0;background:#000b;pointer-events:none}
#slots button.poor .pr{color:#ff8a8a}
/* 뽑기 */
#gl{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#gcv{flex:1;min-height:0;width:100%;object-fit:contain;border:2px solid var(--line);border-radius:14px;background:#060a14;image-rendering:pixelated}
#gp{text-align:center}#gp .nav{margin-top:6px}
/* 공통 */
#fsb,#snd{position:absolute;top:6px;z-index:50;width:38px;height:34px;padding:0;font-size:1rem}
#fsb{right:6px}#snd{right:50px}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:100;background:#000d;border:2px solid var(--btn);color:#fff;padding:8px 14px;border-radius:12px;font-size:.85rem;max-width:90%;text-align:center}
#rot{position:fixed;left:0;right:0;top:0;z-index:200;background:#000e;border-bottom:2px solid var(--btn);color:#fff;padding:10px;text-align:center;font-weight:700;display:none}
@media (orientation:portrait){#rot{display:block}}

/* ===== GUI 리디자인: 게임 로직과 캐릭터 픽셀 아트는 그대로 유지 ===== */
:root{
  --bg:#07111f;--fg:#edf4ff;--card:#142943;--card2:#1d3a5c;
  --line:#54779e;--btn:#f2c65c;--btnfg:#29200e;--btn2:#d99a35;--clear:#71d6a1;
}
html,body{background:#050b14;color:var(--fg)}
#game{
  background:#0b1728;
  border:1px solid #54779e;
  box-shadow:0 24px 80px #000b,0 0 0 5px #0c1b2d;
}
.scr{
  gap:10px;padding:16px 20px;
  background:
    radial-gradient(ellipse at 50% -12%,#31577e 0%,#172e49 38%,#0b192b 78%,#081321 100%);
}
.scr:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;
  background:linear-gradient(135deg,transparent 0 48%,#a8d5ff0b 49% 50%,transparent 51% 100%);
  background-size:22px 22px;
}
.scr>*{position:relative;z-index:1}
.top{
  min-height:46px;padding:5px 104px 9px 0;
  border-bottom:1px solid #7897b54d;
  color:#f5f8ff;font-size:1.15rem;letter-spacing:.04em;
}
.top>b:nth-child(2){text-shadow:0 2px 12px #8ccaff55}
button{
  border:1px solid #ffe39a;border-bottom:4px solid #9c6820;
  border-radius:9px;padding:9px 15px;
  background:linear-gradient(180deg,#ffe8a0 0%,#f2c65c 55%,#d99a35 100%);
  color:#30230c;font-weight:850;letter-spacing:.01em;
  box-shadow:0 3px 10px #0004,inset 0 1px 0 #fff9;
  transition:filter .12s,transform .12s,box-shadow .12s;
}
button:hover:not(:disabled){filter:brightness(1.09);box-shadow:0 5px 14px #0006,inset 0 1px 0 #fff}
button:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;box-shadow:0 1px 5px #0005}
button:disabled{filter:grayscale(.75) brightness(.62);opacity:.72}
input{
  border:1px solid #6689b1;border-radius:9px;background:#091729;
  color:#f5f8ff;box-shadow:inset 0 2px 8px #0005;
}
input:focus{outline:2px solid #f2c65c;outline-offset:1px}
.nav{gap:8px}
.nav button{
  flex:1 1 70px;padding:10px 8px;border:1px solid #7e9fbe;
  border-bottom:3px solid #294766;border-radius:8px;
  background:linear-gradient(180deg,#315579,#1a3553);
  color:#f1f6ff;text-shadow:0 1px 2px #0008;
  box-shadow:inset 0 1px 0 #ffffff25,0 3px 8px #0003;
}
.nav button:hover:not(:disabled){background:linear-gradient(180deg,#426b94,#254766)}
#grid{
  grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;
  align-content:start;padding:10px 4px 4px;
}
#grid button{
  min-height:57px;padding:7px 5px;border:1px solid #6285a9;
  border-bottom:4px solid #294766;border-radius:9px;
  background:linear-gradient(155deg,#244668,#132a44);
  color:#eaf3ff;font-size:.82rem;line-height:1.3;
  box-shadow:inset 0 1px 0 #ffffff20,0 3px 8px #0004;
}
#grid button b{font-size:1.05rem;color:#f5cf70;margin-bottom:2px}
#grid button.cl{
  border-color:#76d5a3;border-bottom-color:#347d61;
  background:linear-gradient(155deg,#245443,#14372f);
}
#grid button:disabled{background:linear-gradient(155deg,#182638,#101b2b);border-color:#34475d;color:#91a0b2}
.tr{
  border:1px solid #54779e;border-radius:11px;padding:11px 13px;margin-bottom:9px;
  background:linear-gradient(145deg,#1c3858,#11263e);
  box-shadow:0 4px 12px #0003,inset 0 1px 0 #ffffff12;
}
.tr small{color:#c4d4e7}
.up{gap:13px;align-items:center}
.up>div{min-width:0}
.ic{image-rendering:pixelated;filter:drop-shadow(0 3px 3px #0008)}
#start{
  background:
    radial-gradient(ellipse at 50% 28%,#3e719c 0%,#1c3b5a 42%,#0b1727 82%);
}
#start::before{opacity:.55}
.t1{
  font-size:82px;letter-spacing:.14em;
  text-shadow:0 5px 0 #101b2a,0 0 30px #9bd8ff88;
}
.t2{
  color:#ffdc76;text-shadow:0 4px 0 #7c451c,0 0 28px #ffb34d99;
}
.sub{font-size:1rem;letter-spacing:.06em;color:#e1efff}
#start #sc{filter:drop-shadow(0 5px 8px #0008)}
#start #goStart{
  min-width:230px;border:2px solid #fff0bf;border-bottom:5px solid #94611d;
  border-radius:12px;font-size:1.25rem;letter-spacing:.08em;
  box-shadow:0 7px 24px #0006,0 0 24px #ffd36b33;
}
#login .box{gap:12px}
#login .tr{padding:16px}
#login .tr>b{font-size:1.08rem;color:#ffe19a}
#login .tr .nav{margin-top:10px}
#forml,#ql,#upl,#trl{padding:5px 3px 12px}
#forml .tr{min-height:84px}
#forml .tr button{min-width:84px}
#gl{gap:10px}
#gcv{border:1px solid #6384a7;border-radius:13px;background:#071323;box-shadow:inset 0 0 30px #0008,0 5px 16px #0004}
#gp{padding:8px 10px;border:1px solid #54779e;border-radius:11px;background:#122943}
#gp .nav{margin-top:10px}
#gp .nav button{font-size:.86rem}
#battle{background:#07111f}
#bwrap{background:linear-gradient(#07111f,#0b1726);border-bottom:1px solid #6886a7}
#c{image-rendering:pixelated}
#hud{padding:9px 100px 0 12px}
#pause{
  min-width:48px;border:1px solid #a8c1db;border-bottom:3px solid #38536f;
  background:linear-gradient(#527494,#294663);color:#fff;border-radius:8px;
}
#stageTitle{
  top:12px;color:#f5f8ff;font-weight:850;letter-spacing:.08em;
  text-shadow:0 2px 4px #000,0 0 12px #000;
}
#money{
  padding:3px 10px;border:1px solid #e5c36f;border-radius:8px;
  background:#101c2bd9;color:#ffdc78;font-size:1.45rem;
}
#ctrl{
  grid-template-columns:145px 1fr 145px;gap:9px;padding:9px;
  background:linear-gradient(180deg,#203b59,#0b192a);
  border-top:2px solid #6c8eae;
}
#wk,#cn{
  border-radius:11px;padding:6px;font-size:1rem;line-height:1.35;
  box-shadow:inset 0 1px 0 #ffffff35,0 4px 10px #0005;
}
#wk{
  border:1px solid #b6d5ef;border-bottom:4px solid #426482;
  background:linear-gradient(#7ba9ca,#3c6a8d);color:#fff;text-shadow:0 1px 3px #0008;
}
#cn{
  border:1px solid #f2d48a;border-bottom:4px solid #956c29;
  background:linear-gradient(#ffe18a,#d9a83f);color:#30230c;
}
#slots{gap:6px}
#slots button{
  border:1px solid #86a9cd;border-bottom:4px solid #294969;border-radius:8px;
  background:linear-gradient(155deg,#355d83,#1a3553);
  box-shadow:inset 0 1px 0 #ffffff30,0 3px 7px #0005;
}
#slots button:hover:not(:disabled){background:linear-gradient(155deg,#4777a2,#244969)}
#slots button:disabled{opacity:.38}
#slots .pr{color:#ffdc78;font-size:.9rem}
.pbox{
  width:320px;padding:21px;border:2px solid #7898b8;border-radius:15px;
  background:linear-gradient(155deg,#244564,#10243b);
  box-shadow:0 15px 50px #0009,inset 0 1px 0 #ffffff25;
}
.pbox h2{color:#ffe19a}
.pbox button{
  border:1px solid #8eacc8;border-bottom:3px solid #34516e;
  background:linear-gradient(#52799d,#294967);color:#fff;text-shadow:0 1px 2px #0008;
}
.pbox button:first-of-type{
  border-color:#ffe39a;border-bottom-color:#9c6820;
  background:linear-gradient(#ffe8a0,#d99a35);color:#30230c;text-shadow:none;
}
#fsb,#snd{
  border:1px solid #a4bdd6;border-bottom:3px solid #38536f;border-radius:8px;
  background:linear-gradient(#527494,#294663);color:#fff;
}
#toast{
  border:1px solid #f2d27e;border-radius:10px;background:#10243aee;
  color:#fff4d2;box-shadow:0 7px 24px #0008;
}
#rot{background:#10243a;border-color:#f2c65c}
@media (max-width:700px){
  #grid{grid-template-columns:repeat(6,minmax(0,1fr))}
}


/* ===== Battle Cats풍 전면 GUI 스킨: 인터랙션/레이아웃만 교체, 게임 로직과 캐릭터 원화는 유지 ===== */
:root{
  --fg:#21170e; --card:#fff0c5; --card2:#f6d98e; --line:#23170e;
  --btn:#ffd34d; --btn2:#f28b22; --btnfg:#241509; --clear:#55a94d;
}
html,body{background:#1c130b;color:#24180d;font-family:system-ui,"Noto Sans KR","Malgun Gothic",sans-serif}
#game{background:#f4d990;border:3px solid #21160d;box-shadow:0 0 0 4px #e7a934,0 20px 70px #000c}
.scr{
  color:#25180c;gap:9px;padding:13px 17px;
  background-color:#f7e5b2;
  background-image:radial-gradient(#9e713a26 .8px,transparent .8px),linear-gradient(180deg,#fff1c9,#f1d58e);
  background-size:7px 7px,100% 100%;
}
.scr:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(135deg,transparent 0 15px,#fff8 15px 17px,transparent 17px 31px)}
.scr>*{z-index:1}
.top{min-height:43px;padding:4px 105px 8px 0;border-bottom:3px solid #2a1a0d;color:#2b1b0d;font-size:1.12rem;letter-spacing:.02em;text-shadow:1px 1px #fff7}
.top>b:nth-child(2){font-weight:1000;text-shadow:1px 2px #fff8}
button{
  position:relative;border:3px solid #25170c;border-bottom-width:6px;border-radius:7px;
  padding:8px 13px;background:linear-gradient(180deg,#fff18b 0%,#ffd64c 48%,#f49a25 100%);
  color:#291809;font-weight:1000;letter-spacing:.01em;text-shadow:0 1px #fff9;
  box-shadow:0 2px 0 #fff7 inset,0 3px 0 #9c5c1b,2px 4px 0 #25170c;
  transition:transform .09s,filter .12s,box-shadow .09s;
}
button:before{content:"";position:absolute;inset:3px;border:1px solid #fff8;border-radius:3px;pointer-events:none}
button:hover:not(:disabled){filter:brightness(1.12) saturate(1.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translate(2px,3px);border-bottom-width:3px;box-shadow:0 1px 0 #fff7 inset,0 1px 0 #9c5c1b,1px 2px 0 #25170c}
button:disabled{filter:grayscale(1) brightness(.78);opacity:.68;box-shadow:0 1px 0 #25170c}
.nav{gap:7px}
.nav button{border:3px solid #25170c;border-bottom-width:5px;border-radius:5px;background:linear-gradient(#fff3a5,#f8c34b 55%,#dc8425);color:#2b190a;padding:9px 7px;text-shadow:0 1px #fff9;box-shadow:0 2px 0 #fff8 inset,0 2px 0 #9b581d,2px 3px 0 #25170c}
.nav button:nth-child(3n+2){background:linear-gradient(#ffe4a0,#ffad4a 60%,#d96c25)}
.nav button:nth-child(3n){background:linear-gradient(#ffd1b1,#f78b62 60%,#c94d2b)}
input{border:3px solid #2a1a0d;border-radius:5px;background:#fff8df;color:#28190d;box-shadow:inset 0 2px 4px #6c451b33}
input:focus{outline:3px solid #ef9b25;outline-offset:1px}
#grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:8px 4px}
#grid button{min-height:60px;border:3px solid #25170c;border-bottom-width:5px;border-radius:5px;background:linear-gradient(150deg,#fff1bd,#f0c96f);color:#24170c;font-size:.82rem;text-shadow:0 1px #fff9;box-shadow:inset 0 2px #fff9,0 2px 0 #a36b24,2px 3px 0 #25170c}
#grid button b{font-size:1.1rem;color:#9e3c18;text-shadow:1px 1px #fff;margin-bottom:2px}
#grid button.cl{border-color:#1e4c1c;background:linear-gradient(#e7ffb9,#8dcc63);color:#18300f;box-shadow:inset 0 2px #fff9,0 2px 0 #47752e,2px 3px 0 #25170c}
#grid button:disabled{background:linear-gradient(#e4d8b8,#b7a985);color:#75684e;border-color:#6d604b}
.tr{border:3px solid #2a1a0d;border-radius:5px;padding:10px 12px;margin-bottom:8px;background:linear-gradient(135deg,#fff3cc,#f3d58e);color:#291a0c;box-shadow:inset 0 2px #fff9,2px 3px 0 #a16b29}
.tr small{color:#70502b}
.up{gap:12px;align-items:center}
.ic{filter:drop-shadow(1px 2px 0 #fff9)}

<script>
const $=id=>document.getElementById(id);
const show=n=>['start','login','world','select','tre','up','form','gacha','quest','enemyDex','myDex','attendance','battle'].forEach(s=>$(s).classList.toggle('hide',s!==n));
const W=800,GY=250;
// 960x540 고정 화면을 창 크기에 맞춰 확대/축소
const game=$('game');
function fit(){const k=Math.min(innerWidth/960,innerHeight/540);game.style.transform='translate(-50%,-50%) scale('+k+')';}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();
let AC=null,sndOn=true;try{sndOn=localStorage.getItem('gw_snd')!=='0';}catch(e){}
function sfx(t,r){if(!sndOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const now=AC.currentTime,tone=(f,d,ty,v,t0,f2)=>{t0=t0||0;const o=AC.createOscillator(),g2=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,now+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+t0+d);g2.gain.setValueAtTime(v||0.06,now+t0);g2.gain.exponentialRampToValueAtTime(0.0001,now+t0+d);o.connect(g2);g2.connect(AC.destination);o.start(now+t0);o.stop(now+t0+d+0.02);};
  if(t==='ui')tone(660,0.07,'square',0.04);
  else if(t==='dep')tone(330,0.12,'square',0.05,0,660);
  else if(t==='hit')tone(140,0.06,'sawtooth',0.05,0,60);
  else if(t==='boss'){tone(90,0.7,'sawtooth',0.09,0,35);tone(60,0.7,'square',0.06,0.05,30);}
  else if(t==='win')[523,659,784,1047].forEach((f,i)=>tone(f,0.18,'square',0.06,i*0.12));
  else if(t==='lose')[392,330,262,196].forEach((f,i)=>tone(f,0.22,'triangle',0.07,i*0.16));
  else if(t==='gacha'){const tb=r?2.8:1.8;tone(180,tb,'sawtooth',0.04,0,900);tone(360,tb,'triangle',0.03,0,1800);
    [784,988,1175,1568].forEach((f,i)=>tone(f,0.35,'square',0.06,tb+i*0.08));if(r)[1047,1319,1568,2093].forEach((f,i)=>tone(f,0.5,'triangle',0.05,tb+0.4+i*0.1));}
  }catch(e){}}
let lastHit=0;function sfxHit(){const n=performance.now();if(n-lastHit>90){lastHit=n;sfx('hit');}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3500);}

const PAL={K:'#1b2430',B:'#5f7f99',S:'#c5d3de',L:'#eef3f7',E:'#ffffff',P:'#101010',C:'#888',A:'#ccc',D:'#555',H:'#ddd',W:'#ffffff',Y:'#ffd84a',R:'#e0402a',O:'#ff9a3c',M:'#aab6c4',N:'#5a6573'};
function shade(hex,p){const n=parseInt(hex.slice(1),16),r=n>>16,g1=(n>>8)&255,b=n&255,f=c=>Math.max(0,Math.min(255,Math.round(p<0?c*(1+p):c+(255-c)*p)));return '#'+((1<<24)+(f(r)<<16)+(f(g1)<<8)+f(b)).toString(16).slice(1);}
function cp(col,acc){return {C:col,A:acc||'#ccc',D:shade(col,-0.3),H:shade(col,0.35)};}
const pl=v=>v.pal||(v.col?cp(v.col,v.acc):null);
function spr(grid,x,y,s,flip,col,c2){c2=c2||g;
  const w=Math.max(...grid.map(r=>r.length)),pal=Object.assign({},PAL,col||{});
  grid.forEach((row,j)=>{for(let i=0;i<row.length;i++){const ch=row[i];if(ch==='.')continue;
    c2.fillStyle=pal[ch];c2.fillRect(Math.round(x+(flip?w-1-i:i)*s),Math.round(y+j*s),s,s);}});
}
const g=$('c').getContext('2d');g.imageSmoothingEnabled=false;

// 진화(폼 체인지) 장식: 왕관·뿔·날개·불꽃·갑옷·망토·가시·후광·방패를 얹어서 겉모습을 크게 바꿔요
function deco(g0,kinds){
  const w=Math.max(...g0.map(r=>r.length)),TP=5,LP=4,RP=3,H=g0.length+TP,Wd=w+LP+RP,a=[];
  for(let y=0;y<H;y++)a.push(Array(Wd).fill('.'));
  g0.forEach((r,y)=>{for(let x=0;x<r.length;x++)a[y+TP][x+LP]=r[x];});
  const set=(x,y,c)=>{if(y>=0&&y<H&&x>=0&&x<Wd&&a[y][x]==='.')a[y][x]=c;};
  const top=a.findIndex(r=>r.some(c=>c!=='.')),row=a[top];
  let x1=row.findIndex(c=>c!=='.'),x2=Wd-1-[...row].reverse().findIndex(c=>c!=='.');
  const tc=(x1+x2)>>1,mid=top+((H-top)>>1);
  let minX=Wd,maxX=0;a.forEach(r=>{const f=r.findIndex(c=>c!=='.');if(f>=0&&f<minX)minX=f;const l=Wd-1-[...r].reverse().findIndex(c=>c!=='.');if(l>maxX)maxX=l;});
  kinds.forEach(k=>{
    if(k==='crown'){for(let i=-2;i<=2;i++)set(tc+i,top-1,'Y');[-2,0,2].forEach(i=>set(tc+i,top-2,'Y'));set(tc,top-1,'R');}
    else if(k==='horns'){set(x1,top-1,'W');set(x1-1,top-2,'W');set(x1-1,top-3,'W');set(x2,top-1,'W');set(x2+1,top-2,'W');set(x2+1,top-3,'W');}
    else if(k==='flame'){for(let x=x1;x<=x2;x++){const hh=2+((x*7)%3);for(let j=1;j<=hh;j++)set(x,top-j,j===hh?'Y':'O');}}
    else if(k==='wings'){for(let j=0;j<6;j++)for(let i=0;i<3;i++)set(minX+2-j+i,mid-2-j,i===0?'K':'W');for(let j=0;j<4;j++)for(let i=0;i<3;i++)set(minX+4-j+i,mid-1-j,'W');}
    else if(k==='armor'){for(let y=mid-1;y<H-1;y++)for(let x=0;x<Wd;x++){const c=a[y][x],m={C:'M',B:'M',S:'W',L:'W',D:'N',H:'W'}[c];if(m)a[y][x]=m;}set(x1,top+1,'N');set(x2,top+1,'N');}
    else if(k==='cape'){for(let y=mid;y<H-1;y++)set(minX-1,y,'R');for(let y=mid+1;y<H-1;y++)set(minX-2,y,'R');set(minX-3,H-3,'R');}
    else if(k==='spikes'){for(let x=x1;x<=x2;x+=2)set(x,top-1,'M');}
    else if(k==='ring'){for(let i=-3;i<=3;i++)set(tc+i,top-3,i===-3||i===3?'.':'Y');set(tc-3,top-2,'Y');set(tc+3,top-2,'Y');}
  });
  return a.map(r=>r.join('').replace(/\.+$/,''));
}

function buildSlots(){ // 짧게 누름 = 생산, 0.5초 길게 누름 = 캐릭터 정보
  const sl=$('slots');sl.innerHTML='';slotEls.length=0;
  SL=fl().map(id=>MY.findIndex(x=>x.id===id));
  for(let i=0;i<10;i++){const b=document.createElement('button');const u=MY[SL[i]];
    if(u){b.appendChild(ico(u));const pr=document.createElement('span');pr.className='pr';pr.textContent=Math.round(fm(u).cost*CHC[CH])+'원';const cd=document.createElement('i');cd.className='cdv';b.append(pr,cd);b._pr=pr;b._cd=cd;}
    else b.disabled=true;
    let holdTimer=null,held=false,down=false,origin=null;
    function cancelHold(){clearTimeout(holdTimer);holdTimer=null;}
    b.addEventListener('pointerdown',e=>{
      if(e.button!==0&&e.pointerType==='mouse')return;
      e.preventDefault();if(!S||S.over||S.paused||!u)return;
      down=true;held=false;origin={x:e.clientX,y:e.clientY};
      try{b.setPointerCapture(e.pointerId);}catch(err){}
      cancelHold();holdTimer=setTimeout(()=>{if(down){held=true;showUnitInfo(SL[i]);}},500);
    });
    b.addEventListener('pointermove',e=>{
      if(down&&origin&&Math.hypot(e.clientX-origin.x,e.clientY-origin.y)>16){down=false;cancelHold();}
    });
    b.addEventListener('pointerup',e=>{
      if(!down)return;
      e.preventDefault();down=false;cancelHold();
      if(!held&&!$('unitInfoLayer').classList.contains('hide'))return;
      if(!held)deploy(SL[i]);
    });
    b.addEventListener('pointercancel',()=>{down=false;cancelHold();});
    b.addEventListener('lostpointercapture',()=>{down=false;cancelHold();});
    b.addEventListener('contextmenu',e=>e.preventDefault());
    sl.appendChild(b);slotEls.push(b);
  }
}

  for(const r of S.ring){const q=r.t/0.8;g.save();g.globalAlpha=Math.max(0,1-q);g.strokeStyle=r.ally?'#75d9ff':'#ff5a3a';g.lineWidth=r.ally?4:7;g.beginPath();g.ellipse(r.x,GY,q*(r.ally?110:760),6+q*(r.ally?60:34),0,0,7);g.stroke();g.restore();}
  for(const p of S.pop){const q=p.t/0.7,y=GY-80-q*28;g.save();g.globalAlpha=Math.max(0,1-q*q);g.font='bold 13px sans-serif';g.textAlign='center';g.lineWidth=3;g.strokeStyle='#000b';g.strokeText(p.s,p.x,y);g.fillStyle=p.c;g.fillText(p.s,p.x,y);g.restore();}
  for(const p of S.pj){const q=p.t/p.dur,x=p.x0+(p.tx-p.x0)*q,y=135+(GY-16-135)*q-90*Math.sin(q*Math.PI);
    g.save();g.translate(x,y);g.rotate(q*12);g.fillStyle='#8a8f98';g.fillRect(-9,-9,18,18);g.fillStyle='#d9c27a';g.fillRect(-4,-12,6,6);g.fillStyle='#6aa84f';g.fillRect(3,2,7,7);g.fillStyle='#c0392b';g.fillRect(-10,3,6,6);g.restore();}
  for(const b of S.bm){const q=b.t/0.5;g.save();g.globalAlpha=1-q;g.fillStyle='#b9a26a';g.beginPath();g.arc(b.x,GY,70*Math.min(1,q*4),Math.PI,2*Math.PI);g.fill();
    ['#8a8f98','#d9c27a','#6aa84f','#c0392b'].forEach((c,i)=>{for(let j=0;j<2;j++){const a=(i*2+j)*Math.PI/4,r=20+q*80;g.fillStyle=c;g.fillRect(b.x+Math.cos(a)*r-4,GY-20+Math.sin(a)*r*0.8-4-q*20,8,8);}});g.restore();}
  g.restore();
  if(S.bw>0){g.save();g.globalAlpha=Math.min(1,S.bw*1.2);g.fillStyle='#ff2a1a22';g.fillRect(0,0,W,300);txt('⚠ BOSS ⚠',W/2,110,46);g.restore();}
  if(S.over){g.fillStyle='#000a';g.fillRect(0,0,W,300);g.fillStyle='#fff';g.font='bold 40px sans-serif';g.textAlign='center';
    g.fillText(S.over==='win'?'승리!':'패배...',W/2,100);g.font='18px sans-serif';
    if(S.over==='win')g.fillText('XP +'+S.xpg.toLocaleString()+'  (보유 '+xp.toLocaleString()+')',W/2,134);
    if(S.drop)g.fillText(S.drop,W/2,162);
    if(S.drop2){g.fillStyle='#ffe27a';g.fillText(S.drop2,W/2,188);g.fillStyle='#fff';}
    g.fillText('화면을 누르면 '+(S.over==='win'?'스테이지 선택으로':'다시 도전'),W/2,226);}
  $('money').textContent=Math.floor(S.money)+' / '+S.maxM+'원';
  {const wb=$('wk'),cost=Math.round(S.wl*80*(1-0.2*basicProgress('accounting')));wb.innerHTML=S.wl>=8?'도령<br>Lv8 MAX':'도령 Lv'+S.wl+'<br>'+cost+'원<br><small>[W]</small>';wb.disabled=!!S.over||S.wl>=8||S.money<cost;}
  {const cb=$('cn'),rd=S.cn>=1,pc=Math.floor(S.cn*100);cb.innerHTML=rd?'쓰레기포<br>발사!<br><small>[E]</small>':'쓰레기포<br>'+pc+'%';
    cb.style.background=rd?'':'linear-gradient(to top,#ffd84a '+pc+'%,#3a4250 '+pc+'%)';cb.style.color=rd?'':'#fff';cb.disabled=!!S.over;}
  SL.forEach((k,i)=>{const u=MY[k],b=slotEls[i],cd=S.cool[k];if(!u||!b._cd)return;
    b.disabled=!!S.over;b._cd.style.height=cd>0?Math.min(100,cd/unitCooldown(u)*100)+'%':'0';b.classList.toggle('poor',S.money<Math.round(fm(u).cost*S.cm));});
}
$('c').addEventListener('click',()=>{if(!S||!S.over)return;
  if(S.over==='win'){cancelAnimationFrame(raf);S=null;buildGrid();show('select');}else startStage(stageIdx);});
function loop(n){
  if(!S)return;
  const dt=Math.min(.05,Math.max(0,(n-last)/1000));last=n;
  if(!S.paused){
    update(dt);
    // 두 번의 시뮬레이션 단계로 실제 이동/공격/쿨타임/자원 모두 2배속 처리
    if(speedUp&&!S.over)update(dt);
  }
  draw();raf=requestAnimationFrame(loop);
}
</script>
